<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#40009e" />
    <meta name="description" content="StreamUI 实时音频可视化与终端弹幕机" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>StreamUI</title>
  </head>
  <body>
    <main id="workspace" tabindex="-1" aria-label="音频可视化与弹幕工作区">
      <svg class="stage-backdrop" viewBox="0 0 3840 2160" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <mask id="stage-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%" style="mask-type: luminance">
            <rect width="100%" height="100%" fill="white" />
            <rect id="stream-cutout" width="0" height="0" fill="black" />
          </mask>
        </defs>
        <rect width="100%" height="100%" fill="black" mask="url(#stage-mask)" />
      </svg>
      <stream-marquee data-band="bottom-secondary" aria-label="底部感谢文字带"></stream-marquee>
      <stream-marquee data-band="bottom-primary" aria-label="底部提示文字带"></stream-marquee>
      <section class="scope-window stream-window" id="stream-window" tabindex="0" aria-label="直播主画面窗口">
        <div class="detection-chrome" aria-hidden="true">
        <svg class="pane-label" viewBox="0 0 263.41 63.87" aria-hidden="true"><rect width="263.41" height="63.87" fill="currentColor"/><g fill="white" font-family="'JetBrains Mono', monospace" font-weight="100" font-size="20.833"><text data-detection-class x="15.97" y="39.54">STREAMING</text><text data-detection-confidence x="192.02" y="39.54">0.79</text></g></svg>
        </div>
      </section>
      <section class="scope-window" id="spectrogram-window" tabindex="0" aria-label="声谱图窗口">
        <audio-scope mode="spectrogram" aria-label="实时声谱图"></audio-scope>
        <now-playing role="img" aria-label="当前曲目"></now-playing>
      </section>
      <section class="scope-window" id="waveform-window" tabindex="0" aria-label="波形窗口">
        <audio-scope mode="waveform" aria-label="实时波形"></audio-scope>
      </section>
      <section class="scope-window chat-window" id="chat-window" tabindex="0" aria-label="弹幕窗口">
        <div class="detection-chrome" aria-hidden="true">
        <svg class="pane-label" viewBox="0 0 263.41 63.87" aria-hidden="true"><rect width="263.41" height="63.87" fill="currentColor"/><g fill="white" font-family="'JetBrains Mono', monospace" font-weight="100" font-size="20.833"><text data-detection-class x="21.08" y="39.54">CHAT</text><text data-detection-confidence x="185.31" y="39.54">0.64</text></g></svg>
        </div>
        <chat-terminal aria-label="弹幕终端"></chat-terminal>
        <chat-history-terminal aria-label="滚动弹幕终端"></chat-history-terminal>
      </section>
      <section class="scope-window wordmark-window brand-window" id="wordmark-window" tabindex="0" aria-label="品牌循环字标与信息终端">
        <stream-metadata class="stream-metadata" aria-label="直播信息终端"></stream-metadata>
        <kinetic-wordmark class="brand-wordmark" effect="blur"></kinetic-wordmark>
      </section>
      <section class="scope-window themebar-window title-window" id="wordmark-blur-window" tabindex="0" aria-label="中英文交替标题与装饰">
        <img class="themebar-art" src="/stage/themebar.svg" alt="" draggable="false" aria-hidden="true" />
        <on-air-indicator role="img" aria-label="ON AIR"></on-air-indicator>
        <barcode-code role="img" aria-label="内容为 LATENITE 的条码"></barcode-code>
        <data-matrix-code role="img" aria-label="内容为 LATENITE 的 Data Matrix"></data-matrix-code>
        <locator-marker role="img" aria-label="圆环与旋转 X 定位标志"></locator-marker>
        <design-credit role="img" aria-label="DSGND BY WHEN"></design-credit>
        <kinetic-wordmark id="bilingual-title" title-text bilingual effect="stretch"></kinetic-wordmark>
      </section>
      <svg class="stage-dividers" viewBox="0 0 3840 2160" preserveAspectRatio="none" aria-hidden="true">
        <path id="main-top-divider" data-divider="main-top" d="M0 276.2784 L3840 276.2784" />
        <path id="main-bottom-divider" data-divider="main-bottom" d="M0 1883.99 L3840 1883.99" />
        <path id="audio-split-divider" data-divider="audio-split" d="M2972.7 1883.99 L2972.7 2102.605" />
        <path id="audio-bottom-divider" data-divider="audio-bottom" d="M0 2102.605 L3840 2102.605" />
      </svg>
    </main>
    <div id="layer-menu" class="layer-menu" role="menu" aria-label="调整窗口层级" hidden>
      <button type="button" role="menuitem" data-layer="front">置于顶层</button>
      <button type="button" role="menuitem" data-layer="up">上移一层</button>
      <span class="menu-separator" aria-hidden="true"></span>
      <button type="button" role="menuitem" data-layer="down">下移一层</button>
      <button type="button" role="menuitem" data-layer="back">置于底层</button>
      <span class="menu-separator" aria-hidden="true"></span>
      <button type="button" role="menuitemcheckbox" data-action="invert" aria-checked="false">反色</button>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
