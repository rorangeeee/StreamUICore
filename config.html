<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="/config-appearance.js"></script><link rel="stylesheet" href="/config-theme.css"><link rel="icon" href="/favicon.svg"><title>StreamUI · 配置</title></head>
<body><div class="console">
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">S</span>StreamUI</a>
    <nav role="tablist" aria-label="配置页面">
      <button id="tab-preview" role="tab" aria-selected="true" aria-controls="panel-preview" data-tab="preview">预览</button>
      <button id="tab-scenes" role="tab" aria-selected="false" aria-controls="panel-scenes" data-tab="scenes" tabindex="-1">场景配置</button>
      <button id="tab-plugins" role="tab" aria-selected="false" aria-controls="panel-plugins" data-tab="plugins" tabindex="-1">插件配置</button>
    </nav>
    <div id="sidebar-controls"></div>
    <div class="sidebar-footer"><span id="connection-dot"></span><span id="connection-status">正在连接</span></div>
  </aside>
  <main>
    <section id="panel-preview" role="tabpanel" aria-labelledby="tab-preview">
      <div class="page-heading"><h1>预览</h1><button class="button" id="open-output" type="button">打开 OBS 画面</button></div>
      <div class="preset-row"><label>预设<select id="preset-picker"></select></label><button class="button primary" id="activate-preset" type="button">启用预设</button><button class="text-button" id="refresh-presets" type="button">刷新</button><button class="text-button" id="open-presets" type="button">打开目录</button></div>
      <p id="preset-error" class="error" role="status" hidden></p>
      <div class="scene-row"><label>预览场景<select id="preview-scene"></select></label><button class="button" id="replay" type="button">重播动效</button></div>
      <div class="stage-shell"><div id="stage-viewport"><iframe id="preview-frame" title="场景预览"></iframe><div id="empty-preview">选择预设</div></div><div class="stage-footer"><span id="canvas-size"></span><button class="text-button" id="reload-preview" type="button">刷新预览</button></div></div>
      <div class="output-address"><div><span>OBS 浏览器源地址</span><code id="output-url"></code></div><button class="button" id="copy-url" type="button">复制地址</button></div>
    </section>
    <section id="panel-scenes" role="tabpanel" aria-labelledby="tab-scenes" hidden>
      <div class="page-heading"><h1>场景配置</h1></div>
      <div class="scene-row"><label>场景<select id="settings-scene"></select></label></div>
      <div id="scene-settings"></div><div id="preset-settings"></div><p id="empty-settings" class="empty" hidden>这个场景没有配置项</p>
    </section>
    <section id="panel-plugins" role="tabpanel" aria-labelledby="tab-plugins" hidden>
      <div class="page-heading"><h1>插件配置</h1><div class="actions"><button class="text-button" id="refresh-plugins" type="button">刷新</button><button class="button" id="open-plugins" type="button">打开目录</button></div></div>
      <div id="plugin-list"></div><p id="empty-plugins" class="empty" hidden>暂无插件</p>
    </section>
  </main>
</div><div id="feedback" class="feedback" role="status" hidden></div><script type="module" src="/src/config.ts"></script></body></html>
