<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#f5f5f7"/><script src="/config-appearance.js"></script><link rel="stylesheet" href="/config-theme.css"/><link rel="icon" href="/favicon.svg"/><title>StreamUI · 设置</title></head>
<body><div class="console">
  <aside class="sidebar">
    <a class="brand" href="/"><span class="brand-mark">S</span><span>StreamUI</span></a>
    <nav class="tabs" role="tablist" aria-label="控制台页面">
      <button id="tab-preview" type="button" role="tab" aria-selected="true" aria-controls="panel-stage" data-tab="preview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4"/></svg>预览</button>
      <button id="tab-settings" type="button" role="tab" aria-selected="false" aria-controls="panel-settings" data-tab="settings" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg>设置</button>
    </nav>
    <div class="sidebar-footer"><span class="status-dot" id="host-dot"></span><span id="host-status">正在连接</span></div>
  </aside>
  <main class="app-main">
    <section id="panel-stage" role="tabpanel" aria-labelledby="tab-preview">
      <div class="page-heading"><h1>预览</h1><button class="button" id="open-obs" type="button">打开画面</button></div>
      <div class="preset-controls"><label for="preset-picker">已安装预设<select id="preset-picker" disabled><option value="">不启用预设</option></select></label><button class="button primary" id="apply-preset" type="button" disabled>应用预设</button><button class="text-button" id="reload-presets" type="button">刷新列表</button></div>
      <p class="help" id="preset-message">预设将在选择并应用后加载。</p>
      <div class="layout-controls"><label for="scene-picker">直播场景<select id="scene-picker" disabled></select></label></div>
      <div class="away-control"><label for="away-enabled">暂离模式<input id="away-enabled" type="checkbox" role="switch" disabled/></label><span id="away-status" role="status">未连接</span></div>
      <div class="stage-shell"><div id="stage-viewport"><iframe id="output-frame" title="OBS 实时画面预览" tabindex="-1"></iframe><div id="preset-empty">尚未启用预设</div></div><div class="stage-footer"><span><span class="live-dot"></span>实时画面 <span id="canvas-size">—</span></span><button class="text-button" id="reload-preview" type="button">刷新预览</button></div></div>
      <div class="output-address"><div><span class="field-kicker">OBS 浏览器源地址</span><code id="output-url">正在连接…</code></div><button class="button" id="copy-url" type="button">复制地址</button></div>
    </section>
    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="page-heading"><h1>设置</h1></div>
      <form id="settings-form"><div class="settings-grid">
        <section class="card"><div class="card-heading"><h2>外观</h2></div><label class="field">配色<select id="appearance-mode" data-immediate><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">暗色</option></select></label></section>
        <section class="card"><div class="card-heading"><h2>暂离模式</h2></div><label class="toggle-row"><span>暂离</span><input id="away-settings-enabled" type="checkbox" role="switch" data-immediate disabled/></label></section>
        <section class="card"><div class="card-heading"><h2>OBS 连接</h2><span class="pill" id="obs-status">未连接</span></div><label class="toggle-row"><span>连接 OBS</span><input id="obs-enabled" type="checkbox" role="switch"/></label><div class="title-fields"><label class="field">WebSocket 地址<input id="obs-url" type="url" required spellcheck="false"/></label><label class="field">密码<input id="obs-password" type="password" autocomplete="off"/></label></div><div class="info-row"><span>当前输出场景</span><output id="obs-current">—</output></div><p class="status-line error" id="obs-error" hidden></p><button class="text-button" id="reconnect-obs" type="button">重新连接 OBS</button></section>
        <section class="card"><div class="card-heading"><h2>弹幕连接</h2><span class="pill" id="chat-status">未连接</span></div><label class="toggle-row"><span>连接弹幕</span><input id="chat-enabled" type="checkbox" role="switch"/></label><div class="title-fields"><label class="field">Event Bridge 地址<input id="chat-url" type="url" required spellcheck="false"/></label><label class="field">Token<input id="chat-token" type="password" autocomplete="off"/></label></div><label class="check-row"><input id="chat-local" type="checkbox"/><span>启动本地 Event Bridge</span></label><div class="bridge-detail"><span>已接收事件 <strong id="chat-count">0</strong></span></div><p class="status-line error" id="chat-error" hidden></p><button class="text-button" id="reconnect-chat" type="button">重新连接弹幕</button></section>
        <section class="card"><div class="card-heading"><h2>插件</h2><button class="text-button" id="reload-plugins" type="button" data-immediate>刷新</button></div><div id="plugin-list"></div><div class="plugin-empty" id="plugin-empty">暂无插件</div><button class="text-button" id="open-plugins" type="button" data-immediate>打开插件目录</button></section>
        <section class="card"><div class="card-heading"><h2>后台</h2></div><label class="check-row"><input id="startup-enabled" type="checkbox" data-immediate/><span>登录 Windows 时启动</span></label><button class="text-button" id="open-data" type="button" data-immediate>打开用户目录</button></section>
      </div><div class="savebar"><span id="save-status" role="status">未修改</span><button class="button primary" id="save-settings" type="submit" disabled>保存并应用</button></div></form>
      <section id="scene-parameters" aria-label="场景参数"></section>
      <section class="card" id="plugin-panel" hidden><div class="card-heading"><h2 id="plugin-panel-title">插件设置</h2><button class="text-button" id="close-plugin-panel" type="button">关闭</button></div><iframe id="plugin-config-frame" title="插件设置"></iframe><form id="plugin-json-form" hidden><label class="field">JSON 设置<textarea id="plugin-json" rows="8" spellcheck="false"></textarea></label><div class="form-actions"><button class="button primary" type="submit">保存</button></div></form></section>
    </section>
  </main>
</div><div class="feedback" id="feedback" role="status" hidden></div><script type="module" src="/src/config.ts"></script></body></html>
