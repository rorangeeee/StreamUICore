<!doctype html><html lang="zh-CN"><meta charset="utf-8"><script src="/config-appearance.js"></script><link rel="stylesheet" href="/config-theme.css"><style>body{margin:0;font:15px system-ui;color:var(--text)}label{display:grid;gap:8px}input{background:var(--field);color:var(--text);font:inherit;border:1px solid var(--border);border-radius:8px;padding:10px}button{margin-top:16px;background:var(--accent);color:white;border:0;border-radius:8px;padding:9px 20px;font:inherit}</style><form><label>直播标题<input id="title" required></label><button>保存</button><output id="status"></output></form><script type="module">
import{createClient,getSceneContext}from'/sdk/streamui.js';const client=createClient(),settings=client.settings('preset',getSceneContext().presetId),values=await settings.read();document.getElementById('title').value=values.title;
document.querySelector('form').onsubmit=async event=>{event.preventDefault();try{await settings.save({...values,title:document.getElementById('title').value});document.getElementById('status').textContent='已保存';}catch(error){document.getElementById('status').textContent=error.message;}};</script></html>
